<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#243C4C">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <title>Verify Your Email - Radgir</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
    <script src="theme.js"></script>
    <style>
        body {
            background-color: var(--background-alt);
            min-height: 100vh;
            margin: 0;
            padding: 0 20px 40px;
        }

        .await-container {
            background: var(--background-color);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 560px;
            width: 100%;
            margin: 40px auto;
            box-sizing: border-box;
            text-align: center;
        }

        .await-container h1 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .await-container p {
            color: var(--text-light);
            line-height: 1.6;
        }

        .await-email {
            display: inline-block;
            margin: 12px 0 20px;
            padding: 10px 14px;
            border-radius: 6px;
            background: var(--background-alt);
            color: var(--primary-color);
            font-weight: 600;
            word-break: break-all;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-light);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover { background: var(--primary-color); }
        .btn-submit:disabled { background: var(--text-light); cursor: not-allowed; }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: start;
        }

        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Radgir</div>
            <ul class="nav-links"></ul>
            <div class="menu-toggle" role="button" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <div class="await-container">
        <h1>Verify your email</h1>
        <p>Your account was created. We sent an authorization link to:</p>
        <div class="await-email" id="pendingEmail">your email</div>
        <p>Open that email and click the verification link. You cannot log in until the link is confirmed.</p>
        <div id="alertContainer"></div>
        <button type="button" class="btn-submit" id="resendBtn">Resend verification email</button>
        <a class="btn-secondary" href="login.html">I already verified — go to Login</a>
        <a class="btn-secondary" href="register.html">Back to Register</a>
    </div>

    <script src="analytics.js"></script>
    <script src="auth.js"></script>
    <script src="navigation.js"></script>
    <script>
        // Clear any accidental session from an old signup flow — unverified users must not stay logged in.
        localStorage.removeItem('token');
        localStorage.removeItem('user');

        const params = new URLSearchParams(window.location.search);
        const emailFromQuery = (params.get('email') || '').trim();
        const emailFromStorage = (sessionStorage.getItem('pendingVerificationEmail') || '').trim();
        const pendingEmail = emailFromQuery || emailFromStorage;

        const emailEl = document.getElementById('pendingEmail');
        const resendBtn = document.getElementById('resendBtn');
        const alertContainer = document.getElementById('alertContainer');

        if (pendingEmail) {
            emailEl.textContent = pendingEmail;
            sessionStorage.setItem('pendingVerificationEmail', pendingEmail);
        } else {
            emailEl.textContent = 'the address you registered with';
        }

        function showAlert(message, type = 'info') {
            alertContainer.innerHTML = '';
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertContainer.appendChild(alert);
        }

        resendBtn.addEventListener('click', async () => {
            const email = (sessionStorage.getItem('pendingVerificationEmail') || pendingEmail || '').trim();
            if (!email) {
                showAlert('Missing email address. Please register again or enter your email on the login page after trying to sign in.', 'error');
                return;
            }

            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';
            try {
                const response = await fetch(`${window.location.origin}/api/auth/resend-verification`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await response.json();
                if (result.success && result.emailSent !== false) {
                    showAlert(result.message || 'Verification email sent. Check your inbox and spam folder.', 'success');
                } else if (result.success && result.emailSent === false) {
                    showAlert(result.message || 'We could not deliver the email right now. Please try again in a few minutes.', 'warning');
                } else {
                    showAlert(result.message || 'Could not resend verification email.', 'error');
                }
                if (result.previewUrl) {
                    const openLink = confirm('SMTP preview available. Open the verification link now?');
                    if (openLink) window.location.href = result.previewUrl;
                }
            } catch (error) {
                console.error('Resend verification failed:', error);
                showAlert('Network error while resending. Please try again.', 'error');
            } finally {
                resendBtn.disabled = false;
                resendBtn.textContent = 'Resend verification email';
            }
        });
    </script>
    <script src="pwa.js"></script>
</body>
</html>
