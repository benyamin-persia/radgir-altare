<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Redirecting…</title>
    <script>
        // Old URL kept only as a jump to listing-editor so Cloudflare/browser stale copies still reach the new form
        (function () {
            var qs = window.location.search || '';
            window.location.replace('listing-editor.html' + qs);
        })();
    </script>
    <meta http-equiv="refresh" content="0;url=listing-editor.html">
</head>
<body>
    <p><a href="listing-editor.html">Continue to listing editor</a></p>
</body>
</html>
